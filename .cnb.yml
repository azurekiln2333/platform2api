main:
  push: &verify
    - name: verify
      docker:
        image: node:24-bookworm
      stages:
        - name: backend-tests
          script: node --test test/*.test.mjs
        - name: console-build-and-tests
          script: |
            npm ci --prefix web
            npm run build --prefix web
            npm test --prefix web

"v*":
  tag_push:
    - name: verify-release
      docker:
        image: node:24-bookworm
      stages:
        - name: validate-release-tag
          script: |
            VERSION=$(node -p "require('./package.json').version")
            if [ "$CNB_BRANCH" != "v$VERSION" ]; then
              echo "Release tag must be v$VERSION, received $CNB_BRANCH" >&2
              exit 1
            fi
        - name: backend-tests
          script: node --test test/*.test.mjs
        - name: console-build-and-tests
          script: |
            npm ci --prefix web
            npm run build --prefix web
            npm test --prefix web

    # Container image for `docker pull`. Registry credentials default to the
    # platform-issued CNB_TOKEN; override CNB_REGISTRY / CNB_REGISTRY_USER /
    # CNB_REGISTRY_PASSWORD / CNB_IMAGE in repository settings when needed.
    - name: publish-image
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - docker
      stages:
        - name: build-and-push-image
          script: |
            set -euo pipefail
            TAG="$CNB_BRANCH"
            VERSION="${TAG#v}"
            REGISTRY="${CNB_REGISTRY:-docker.cnb.cool}"
            REGISTRY_USER="${CNB_REGISTRY_USER:-cnb}"
            REGISTRY_PASSWORD="${CNB_REGISTRY_PASSWORD:-${CNB_TOKEN:?CNB_TOKEN is not set}}"
            IMAGE="${CNB_IMAGE:-$REGISTRY/azurekiln/platform2api}"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
            docker build -t "$IMAGE:$TAG" .
            docker push "$IMAGE:$TAG"
            case "$VERSION" in
              *-*) echo "prerelease $VERSION, latest tag skipped" ;;
              *)
                docker tag "$IMAGE:$TAG" "$IMAGE:latest"
                docker push "$IMAGE:latest"
                ;;
            esac
            echo "pushed $IMAGE:$TAG"
