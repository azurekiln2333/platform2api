# platform2api unified deployment.
#
# Four consoles, four containers, four independent data directories. Each
# service keeps its own repository, image and model-call endpoint; the panel
# only manages them over Compose DNS.
#
#   cp .env.example .env      # set PANEL_ADMIN_KEY
#   mkdir -p data/panel data/cnb/data data/cnb/logs data/codebuddy data/zcode
#   docker compose pull
#   docker compose up -d
#
# Panel:      http://127.0.0.1:9000
# CNB:        http://127.0.0.1:9002
# CodeBuddy:  http://127.0.0.1:8787
# ZCode:      http://127.0.0.1:12283
#
# Everything else — container ports, data paths, health checks, SSO settings,
# gateway keys — is a console setting or an image default. See README.md for
# the optional knobs (BIND_HOST, WATCHTOWER_POLL_INTERVAL, TZ).
name: platform2api

# Shared container settings. The public URL and the Compose-DNS service URLs
# stay out of the anchor because each service names them differently.
x-app: &app
  restart: unless-stopped
  init: true
  env_file:
    - .env
  labels:
    com.centurylinklabs.watchtower.enable: "true"
    com.centurylinklabs.watchtower.scope: platform2api
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  platform2api:
    <<: *app
    image: "${PLATFORM_IMAGE:-ghcr.io/azurekiln2333/platform2api:latest}"
    environment:
      # Compose DNS: the panel never uses loopback defaults inside a container.
      CNB_URL: http://cnb:9002
      CODEBUDDY_URL: http://codebuddy:8787
      ZCODE_URL: http://zcode:12283
    ports:
      - "${BIND_HOST:-127.0.0.1}:9000:9000"
    volumes:
      # Panel-owned state only: SSO settings, service URLs, account tags.
      - ./data/panel:/app/data
    depends_on:
      cnb:
        condition: service_started
      codebuddy:
        condition: service_started
      zcode:
        condition: service_started

  cnb:
    <<: *app
    image: "${CNB_IMAGE:-ghcr.io/azurekiln2333/cnb2api-panel:latest}"
    environment:
      # Browsers reach this console on its own domain; empty keeps the request origin.
      PANEL_PUBLIC_URL: ${CNB_PUBLIC_URL:-}
    ports:
      # Model/inference traffic stays on the service's own endpoint.
      - "${BIND_HOST:-127.0.0.1}:9002:9002"
    volumes:
      - ./data/cnb/data:/app/data
      - ./data/cnb/logs:/app/logs

  codebuddy:
    <<: *app
    image: "${CODEBUDDY_IMAGE:-ghcr.io/azurekiln2333/codebuddy2api:latest}"
    environment:
      PUBLIC_ORIGIN: ${CODEBUDDY_PUBLIC_URL:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8787:8787"
    volumes:
      # One SQLite directory per instance, never shared.
      - ./data/codebuddy:/data/auth

  zcode:
    <<: *app
    image: "${ZCODE_IMAGE:-ghcr.io/azurekiln2333/zcode2api:latest}"
    environment:
      PANEL_PUBLIC_URL: ${ZCODE_PUBLIC_URL:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:12283:12283"
    volumes:
      - ./data/zcode:/app/data
    security_opt:
      - no-new-privileges:true

  # Scoped updater: only containers carrying the enable + scope labels, and it
  # must never update itself. Copied from cnb2api-panel.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: platform2api
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-600}"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.centurylinklabs.watchtower.scope: platform2api
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
